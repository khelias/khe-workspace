# Repos cloned into repos/<name>/ by scripts/workspace.sh.
# One "- name:" entry per repo, keys on their own lines; the scripts read
# this with a line parser, not a YAML library, so keep the flat shape.
# check: runs in the repo before Claude commits there (.claude/hooks/commit-gate.sh).
# private: true exempts a repo from the gate's personal-data scan; every other
# repo is scanned (.claude/hooks/pii-rules.toml). The gate blocks commits in a
# repo inside the workspace that is missing from this list.
# pr: true takes agent work to main through a pull request whose required
# checks pass (estate ADR-023): the gate refuses commits on the default branch
# and pushes that move it.
# release_tag: a glob; the gate refuses a push of a tag matching it (a release).
repos:
  - name: khe-meta
    url: https://github.com/khelias/khe-meta.git
    private: true
    description: Private working layer, the estate roadmap, plans and house documentation.
  - name: khe-architecture
    url: https://github.com/khelias/khe-architecture.git
    check: bash scripts/check.sh
    description: Public estate architecture, the decisions and the estate index.
  - name: khe-homelab
    url: https://github.com/khelias/khe-homelab.git
    check: rc=0; for f in scripts/*.sh; do bash -n "$f" || rc=1; done; [ ! -d infrastructure/edge-fallback ] || node --test infrastructure/edge-fallback/test/ || rc=1; exit $rc
    description: Proxmox + Docker Compose infrastructure.
  - name: khe-home-assistant
    url: https://github.com/khelias/khe-home-assistant.git
    check: bash scripts/check.sh
    description: Home Assistant configuration, dashboard generator and the 3D house view.
  - name: khe-sites
    url: https://github.com/khelias/khe-sites.git
    check: npm run -s check
    pr: true
    description: Static source for khe.ee and the games.khe.ee launcher.
  - name: khe-ui
    url: https://github.com/khelias/khe-ui.git
    check: npm run -s check
    release_tag: v*
    description: Shared UI packages for the apps, published to npm as @khelias/ui.
  - name: khe-study
    url: https://github.com/khelias/khe-study.git
    check: npm run -s lint && npm run -s typecheck && npm run -s test:run && npm run -s test:e2e
    description: Educational web game platform.
  - name: khe-ai-adventure
    url: https://github.com/khelias/khe-ai-adventure.git
    check: npm run -s lint && npx tsc -b && npm run -s test:unit
    description: AI-narrated pass-the-phone party game.
  - name: khe-trips
    url: https://github.com/khelias/khe-trips.git
    private: true
    check: npm run -s lint && npm run -s typecheck && npm test --silent && npm run -s test:e2e
    description: Private family trip atlas.
  - name: khe-albums
    url: https://github.com/khelias/khe-albums.git
    check: .venv/bin/ruff check . && .venv/bin/ruff format --check . && .venv/bin/mypy && .venv/bin/python -m pytest -q
    description: Family album selection from the home photo library, written as Apple Photos favourites.
  - name: khe-bunny-tales
    url: https://github.com/khelias/khe-bunny-tales.git
    description: The family's bedtime stories and the world they share.
  - name: ha-estfeed
    url: https://github.com/khelias/ha-estfeed.git
    check: .venv/bin/ruff check custom_components tests && .venv/bin/ruff format --check custom_components tests && .venv/bin/mypy && .venv/bin/python -m pytest tests -q --cov=custom_components/estfeed --cov-fail-under=85
    upstream: https://github.com/tehisain/ha-estfeed.git
    description: Fork of the Elering Estfeed Home Assistant integration.
